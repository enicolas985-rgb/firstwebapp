<!DOCTYPE html>
<html lang="es"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui" >
          
    <h:head>
        
    </h:head>
    <h:body>
        <p:card>
            <f:facet name="title">
                Gestionar docentes
            </f:facet>
            <h:panelGrid columns="3">
                <p:outputLabel for="txfNuip" value="Nuip : " />
                <p:inputText id="txfNuip" placeholder="Nuip"/>
                <p:message for="txfNuip"/>
                
                <p:outputLabel for="txfNombre" value="Nombre : "/>
                <p:inputText id="txfNombre" placeholder="Nombre"/>
                <p:message for="txfNombre"/>
                
                <p:outputLabel for="txfApellidos" value="Apellidos : "/>
                <p:inputNumber id="txfApellidos" placeholder="Apellidos"/>
                <p:message for="txfApellidos"/>
                
                <p:outputLabel for="txfProfesion" value="profesion : "/>
                <p:inputNumber id="txfProfesion" placeholder="Profesion"/>
                <p:message for="txfProfesion"/>
                
                <p:outputLabel for="sltGenero" value="Genero :"/>
                <p:selectOneMenu id="sltGenero" placeholder="Genero">
                    <f:selectItem itemLabel="Mujer" itemValue="mujer"/>
                    <f:selectItem itemLabel="Hombre" itemValue="hombre"/>
                    <f:selectItem itemLabel="No espesifico" itemValue="no_especifico"/>
                </p:selectOneMenu>
                
            </h:panelGrid>
            <f:facet name="footer">
                <p:commandButton icon="pi pi-check" value="save"/>
                <p:commandButton icon="pi pi-times" value="cancel"
                                 styleClass="ui-button-secondary"
                                 style="margin-left: .5em"/>
            </f:facet>
        </p:card>
    </h:body>
</html>
