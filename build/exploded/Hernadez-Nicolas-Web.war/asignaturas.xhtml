<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html lang="es"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
    <h:head>
        <title></title>
    </h:head>
    <h:body>
        <p:card>
            <f:facet name="title">
                Gestionar asignaturas
            </f:facet>
            <h:panelGrid columns="3">
                <p:outputLabel for="txfCodigo" value="Codigo : " />
                <p:inputText id="txfCodigo" placeholder="Codigo" value="#{ctrlAsignaturas.asignatura.codigo}"/>
                <p:message for="txfCodigo"/>
                
                <p:outputLabel for="txfNombre" value="Nombre : "/>
                <p:inputText id="txfNombre" placeholder="Nombre"/>
                <p:message for="txfNombre"/>
                
                <p:outputLabel for="txfCreditos" value="Creditos : "/>
                <p:inputNumber id="txfCreditos" placeholder="Creditos"/>
                <p:message for="txfCreditos"/>
                
                <p:outputLabel for="txfIntensidad" value="Intensidad : "/>
                <p:inputNumber id="txfIntensidad" placeholder="Intensidad"/>
                <p:message for="txfIntensidad"/>
                
                
            </h:panelGrid>
            <f:facet name="footer">
                <p:commandButton icon="pi pi-check" value="save"/>
                <p:commandButton icon="pi pi-times" value="cancel"
                                 styleClass="ui-button-secondary"
                                 style="margin-left: .5em"/>
            </f:facet>
        </p:card>
        <div class="card">
            <p:dataTable>
                <f:facet name="header"> Asignaturas</f:facet>
                <p:column headerText="Codigo">
                    
                </p:column>
                <p:column headerText="Nombre">
                    
                </p:column>
                <p:column headerText="Creditos">
                    
                </p:column>
                <p:column headerText="Intensidad">
                    
                </p:column>
            </p:dataTable>
            
        </div>
    </h:body>
</html>
